name: Construire l'APK Novartis Cours

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Mise à jour des cours toutes les heures

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Miroir GitHub - Téléchargement des cours (yfinance)
        run: |
          pip install yfinance
          cat > fetch_cours.py <<'EOF_PY'
          import yfinance as yf
          import json
          import sys

          def fetch_data(ticker, period, interval, filename):
              try:
                  t = yf.Ticker(ticker)
                  hist = t.history(period=period, interval=interval)
                  if hist.empty:
                      print('Pas de donnees pour', ticker, period, interval)
                      return
                  timestamps = [int(dt.timestamp()) for dt in hist.index]
                  open_p = hist['Open'].tolist()
                  high_p = hist['High'].tolist()
                  low_p = hist['Low'].tolist()
                  close_p = hist['Close'].tolist()
                  volume = hist['Volume'].tolist()
                  adjclose_p = close_p 
                  result = {
                      'chart': {
                          'result': [
                              {
                                  'meta': {'symbol': ticker, 'currency': 'USD'},
                                  'timestamp': timestamps,
                                  'indicators': {
                                      'quote': [{
                                          'open': open_p, 'high': high_p, 'low': low_p, 'close': close_p, 'volume': volume
                                      }],
                                      'adjclose': [{'adjclose': adjclose_p}]
                                  }
                              }
                          ]
                      }
                  }
                  with open(filename, 'w') as f:
                      json.dump(result, f)
                  print('Sauvegarde de', filename)
              except Exception as e:
                  print('Erreur:', e)
                  sys.exit(1)

          fetch_data('NVS', 'max', '1d', 'cours_1d.json')
          fetch_data('NVS', '2y', '1h', 'cours_1h.json')
          EOF_PY
          python fetch_cours.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cours_1d.json cours_1h.json
          git commit -m "Mise à jour automatique des cours" || echo "Aucun nouveau cours"
          git push || echo "Rien à pousser"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clé de signature
        run: |
          if [ ! -f signature.keystore ]; then
            keytool -genkeypair -keystore signature.keystore -storetype PKCS12 -alias appli -keyalg RSA -keysize 2048 -validity 20000 -storepass novartis123 -keypass novartis123 -dname "CN=Novartis Cours"
            git add signature.keystore
            git commit -m "Clé de signature"
            git push
          fi

      - name: Générer le projet Android
        run: |
          mkdir -p "$(dirname "settings.gradle")"
          cat > 'settings.gradle' <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Novartis Cours"
          include ':app'
          EOF_0
          mkdir -p "$(dirname "build.gradle")"
          cat > 'build.gradle' <<'EOF_1'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_1
          mkdir -p "$(dirname "gradle.properties")"
          cat > 'gradle.properties' <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_2
          mkdir -p "$(dirname "app/build.gradle")"
          cat > 'app/build.gradle' <<'EOF_3'
          plugins { id 'com.android.application' }
          def numero = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
          android {
              namespace 'fr.hack68.novartis'
              compileSdk 34
              defaultConfig {
                  applicationId 'fr.hack68.novartis'
                  minSdk 26
                  targetSdk 34
                  versionCode numero
                  versionName "1.${numero}"
              }
              signingConfigs {
                  cle {
                      storeFile file('signature.keystore')
                      storePassword 'novartis123'
                      keyAlias 'appli'
                      keyPassword 'novartis123'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.cle }
                  release { signingConfig = signingConfigs.cle; minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_3
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <queries>
                  <package android:name="fr.hack68.playstoore" />
              </queries>
              <application
                  android:label="Novartis Cours"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".ServiceFond" android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF_4
          mkdir -p "$(dirname "app/src/main/res/values/colors.xml")"
          cat > 'app/src/main/res/values/colors.xml' <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="fond_icone">#0B5FA5</color>
          </resources>
          EOF_5
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_avant.xml")"
          cat > 'app/src/main/res/drawable/ic_avant.xml' <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M54,36 A18,18 0 1,1 53.99,36 Z" />
          </vector>
          EOF_6
          mkdir -p "$(dirname "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml")"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/fond_icone" />
              <foreground android:drawable="@drawable/ic_avant" />
          </adaptive-icon>
          EOF_7
          mkdir -p "$(dirname "app/src/main/java/fr/hack68/novartis/MainActivity.java")"
          cat > 'app/src/main/java/fr/hack68/novartis/MainActivity.java' <<'EOF_8'
          package fr.hack68.novartis;

          import android.app.Activity;
          import android.content.Intent;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.util.Log;
          import android.webkit.ConsoleMessage;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              WebView w;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Thread.UncaughtExceptionHandler avant = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler((fil, err) -> {
                      try {
                          Intent i = new Intent("fr.hack68.playstoore.ERREUR");
                          i.setPackage("fr.hack68.playstoore");
                          i.putExtra("paquet", getPackageName());
                          i.putExtra("texte", "Plantage Android : " + Log.getStackTraceString(err));
                          sendBroadcast(i);
                      } catch (Exception ignore) { }
                      if (avant != null) avant.uncaughtException(fil, err);
                  });

                  if (android.os.Build.VERSION.SDK_INT >= 26) {
                      android.app.NotificationChannel ch = new android.app.NotificationChannel("novartis_signal", "Signal Novartis", android.app.NotificationManager.IMPORTANCE_DEFAULT);
                      getSystemService(android.app.NotificationManager.class).createNotificationChannel(ch);
                  }
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 100);
                      }
                  }

                  w = new WebView(this);
                  setContentView(w);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  w.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onConsoleMessage(ConsoleMessage m) {
                          if (m.messageLevel() == ConsoleMessage.MessageLevel.ERROR && m.message().contains("SyntaxError"))
                              new Pont().signalerErreur("{\"type\":\"ecran\",\"message\":" + org.json.JSONObject.quote(m.message()) + ",\"ligne\":" + m.lineNumber() + "}");
                          return super.onConsoleMessage(m);
                      }
                  });
                  w.addJavascriptInterface(new Pont(), "Android");
                  try (java.io.InputStream in = getAssets().open("index.html")) {
                      java.io.ByteArrayOutputStream o = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                      w.loadDataWithBaseURL("https://app.local/", o.toString("UTF-8"), "text/html", "utf-8", null);
                  } catch (Exception e) {
                      w.loadData("Erreur : index.html introuvable", "text/plain", "utf-8");
                  }
              }

              @Override public void onBackPressed() { if (w.canGoBack()) w.goBack(); else super.onBackPressed(); }
              @Override protected void onResume() { super.onResume(); surveillerSecousses(true); }
              @Override protected void onPause() { surveillerSecousses(false); super.onPause(); }

              SensorManager capteurs;
              SensorEventListener secousse;
              long derniereSecousse = 0;
              int nbSecousses = 0;
              void surveillerSecousses(boolean actif) {
                  if (capteurs == null) capteurs = getSystemService(SensorManager.class);
                  if (capteurs == null) return;
                  if (secousse == null) secousse = new SensorEventListener() {
                      @Override public void onSensorChanged(SensorEvent e) {
                          float x = e.values[0] / 9.81f, y = e.values[1] / 9.81f, z = e.values[2] / 9.81f;
                          if (Math.sqrt(x * x + y * y + z * z) < 2.5) return;
                          long t = System.currentTimeMillis();
                          if (t - derniereSecousse < 150) return;
                          if (t - derniereSecousse > 1500) nbSecousses = 0;
                          derniereSecousse = t;
                          if (++nbSecousses >= 3) { nbSecousses = 0; w.evaluateJavascript("window.ouvrirSignalement && ouvrirSignalement()", null); }
                      }
                      @Override public void onAccuracyChanged(Sensor s, int a) { }
                  };
                  Sensor acc = capteurs.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  if (actif && acc != null) capteurs.registerListener(secousse, acc, SensorManager.SENSOR_DELAY_UI);
                  else capteurs.unregisterListener(secousse);
              }

              class Pont {
                  @JavascriptInterface public void signalerErreur(String texte) {
                      Intent i = new Intent("fr.hack68.playstoore.ERREUR");
                      i.setPackage("fr.hack68.playstoore");
                      i.putExtra("paquet", getPackageName());
                      i.putExtra("texte", texte);
                      sendBroadcast(i);
                  }
                  @JavascriptInterface public void message(String t) { runOnUiThread(() -> Toast.makeText(MainActivity.this, t, Toast.LENGTH_SHORT).show()); }
                  @JavascriptInterface public void vibrer(int ms) { Vibrator v = getSystemService(Vibrator.class); if (v != null) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE)); }

                  @JavascriptInterface public void lireTexte(final String url, final String idRequete) {
                      new Thread(() -> {
                          String corps = ""; int statut = 0;
                          try {
                              java.net.HttpURLConnection c = (java.net.HttpURLConnection) new java.net.URL(url).openConnection();
                              c.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)");
                              c.setConnectTimeout(15000); c.setReadTimeout(20000);
                              statut = c.getResponseCode();
                              java.io.InputStream is = (statut >= 400) ? c.getErrorStream() : c.getInputStream();
                              if (is != null) {
                                  java.io.ByteArrayOutputStream o = new java.io.ByteArrayOutputStream();
                                  byte[] buf = new byte[8192]; int n;
                                  while ((n = is.read(buf)) > 0) o.write(buf, 0, n);
                                  corps = o.toString("UTF-8");
                              }
                          } catch (Exception e) { corps = String.valueOf(e.getMessage()); statut = 0; }
                          try {
                              org.json.JSONObject arg = new org.json.JSONObject();
                              arg.put("id", idRequete); arg.put("statut", statut); arg.put("corps", corps);
                              final String appel = "window.__reponse && window.__reponse(" + arg.toString() + ")";
                              runOnUiThread(() -> w.evaluateJavascript(appel, null));
                          } catch (Exception ignore) { }
                      }).start();
                  }

                  @JavascriptInterface public void notifier(String titre, String texte) {
                      try {
                          android.app.NotificationManager nm = getSystemService(android.app.NotificationManager.class);
                          if (nm == null) return;
                          android.app.Notification.Builder b;
                          if (android.os.Build.VERSION.SDK_INT >= 26) b = new android.app.Notification.Builder(MainActivity.this, "novartis_signal");
                          else b = new android.app.Notification.Builder(MainActivity.this);
                          b.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(titre).setContentText(texte)
                           .setStyle(new android.app.Notification.BigTextStyle().bigText(texte)).setAutoCancel(true);
                          Intent i = new Intent(MainActivity.this, MainActivity.class);
                          i.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          b.setContentIntent(android.app.PendingIntent.getActivity(MainActivity.this, 0, i, android.app.PendingIntent.FLAG_IMMUTABLE | android.app.PendingIntent.FLAG_UPDATE_CURRENT));
                          nm.notify((int) (System.currentTimeMillis() & 0xFFFFFF), b.build());
                      } catch (Exception ignore) { }
                  }

                  @JavascriptInterface public void ouvrirLien(String url) {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, android.net.Uri.parse(url))); } catch (Exception ignore) { }
                  }

                  @JavascriptInterface public void activerServiceFond(boolean actif) {
                      Intent i = new Intent(MainActivity.this, ServiceFond.class);
                      if (actif) {
                          if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                      } else {
                          stopService(i);
                      }
                  }
              }
          }
          EOF_8
          mkdir -p "$(dirname "app/src/main/java/fr/hack68/novartis/ServiceFond.java")"
          cat > 'app/src/main/java/fr/hack68/novartis/ServiceFond.java' <<'EOF_9'
          package fr.hack68.novartis;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;

          public class ServiceFond extends Service {
              Handler handler;
              Runnable tache;
              int minutes = 45;

              @Override
              public void onCreate() {
                  super.onCreate();
                  handler = new Handler(Looper.getMainLooper());
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("novartis_service", "Surveillance Novartis", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                      Notification n = new Notification.Builder(this, "novartis_service")
                          .setContentTitle("Novartis Cours actif")
                          .setContentText("Surveillance active – les données sont rafraîchies côté serveur.")
                          .setSmallIcon(android.R.drawable.ic_menu_compass)
                          .setOngoing(true)
                          .build();
                      startForeground(1, n);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (tache != null) return START_STICKY;
                  // Le vrai rafraîchissement des cours est fait par GitHub Actions (horaire).
                  // Ce service maintient juste le processus vivant et la notification visible.
                  tache = () -> {
                      // On se contente de se rescheduler proprement
                      handler.postDelayed(tache, minutes * 60 * 1000L);
                  };
                  handler.postDelayed(tache, minutes * 60 * 1000L);
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (handler != null && tache != null) handler.removeCallbacks(tache);
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF_9
          cp signature.keystore app/signature.keystore
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NovartisCours.apk
          gh release create "v${{ github.run_number }}" NovartisCours.apk --title "Novartis Cours ${{ github.run_number }}" --notes "Télécharge NovartisCours.apk et installe-le." --latest
