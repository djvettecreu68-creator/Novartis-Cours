name: Construire l'APK Novartis Cours

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clé de signature
        run: |
          if [ ! -f signature.keystore ]; then
            keytool -genkeypair -keystore signature.keystore -storetype PKCS12 -alias appli -keyalg RSA -keysize 2048 -validity 20000 -storepass novartis123 -keypass novartis123 -dname "CN=Novartis Cours"
            git add signature.keystore
            git commit -m "Clé de signature"
            git push
          fi

      - name: Générer le projet Android
        run: |
          mkdir -p "$(dirname "settings.gradle")"
          cat > 'settings.gradle' <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Novartis Cours"
          include ':app'
          EOF_0
          mkdir -p "$(dirname "build.gradle")"
          cat > 'build.gradle' <<'EOF_1'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_1
          mkdir -p "$(dirname "gradle.properties")"
          cat > 'gradle.properties' <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_2
          mkdir -p "$(dirname "app/build.gradle")"
          cat > 'app/build.gradle' <<'EOF_3'
          plugins { id 'com.android.application' }
          def numero = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
          android {
              namespace 'fr.hack68.novartis'
              compileSdk 34
              defaultConfig {
                  applicationId 'fr.hack68.novartis'
                  minSdk 26
                  targetSdk 34
                  versionCode numero
                  versionName "1.${numero}"
              }
              signingConfigs {
                  cle {
                      storeFile file('signature.keystore')
                      storePassword 'novartis123'
                      keyAlias 'appli'
                      keyPassword 'novartis123'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.cle }
                  release { signingConfig = signingConfigs.cle; minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_3
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <queries>
                  <package android:name="fr.hack68.playstoore" />
              </queries>
              <application
                  android:label="Novartis Cours"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".VeilleJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
              </application>
          </manifest>
          EOF_4
          mkdir -p "$(dirname "app/src/main/res/values/colors.xml")"
          cat > 'app/src/main/res/values/colors.xml' <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="fond_icone">#0B5FA5</color>
          </resources>
          EOF_5
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_avant.xml")"
          cat > 'app/src/main/res/drawable/ic_avant.xml' <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M54,36 A18,18 0 1,1 53.99,36 Z" />
          </vector>
          EOF_6
          mkdir -p "$(dirname "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml")"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/fond_icone" />
              <foreground android:drawable="@drawable/ic_avant" />
          </adaptive-icon>
          EOF_7
          mkdir -p "$(dirname "app/src/main/java/fr/hack68/novartis/MainActivity.java")"
          cat > 'app/src/main/java/fr/hack68/novartis/MainActivity.java' <<'EOF_8'
          package fr.hack68.novartis;

          import android.app.Activity;
          import android.content.Intent;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.util.Log;
          import android.webkit.ConsoleMessage;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              WebView w;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Thread.UncaughtExceptionHandler avant = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler((fil, err) -> {
                      try {
                          Intent i = new Intent("fr.hack68.playstoore.ERREUR");
                          i.setPackage("fr.hack68.playstoore");
                          i.putExtra("paquet", getPackageName());
                          i.putExtra("texte", "Plantage Android : " + Log.getStackTraceString(err));
                          sendBroadcast(i);
                      } catch (Exception ignore) { }
                      if (avant != null) avant.uncaughtException(fil, err);
                  });

                  if (android.os.Build.VERSION.SDK_INT >= 26) {
                      android.app.NotificationChannel ch = new android.app.NotificationChannel("novartis_signal", "Signal Novartis", android.app.NotificationManager.IMPORTANCE_DEFAULT);
                      getSystemService(android.app.NotificationManager.class).createNotificationChannel(ch);
                      getSystemService(android.app.NotificationManager.class).deleteNotificationChannel("novartis_service");
                  }
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 100);
                      }
                  }

                  w = new WebView(this);
                  setContentView(w);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  w.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onConsoleMessage(ConsoleMessage m) {
                          if (m.messageLevel() == ConsoleMessage.MessageLevel.ERROR && m.message().contains("SyntaxError"))
                              new Pont().signalerErreur("{\"type\":\"ecran\",\"message\":" + org.json.JSONObject.quote(m.message()) + ",\"ligne\":" + m.lineNumber() + "}");
                          return super.onConsoleMessage(m);
                      }
                  });
                  w.addJavascriptInterface(new Pont(), "Android");
                  try (java.io.InputStream in = getAssets().open("index.html")) {
                      java.io.ByteArrayOutputStream o = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                      w.loadDataWithBaseURL("https://app.local/", o.toString("UTF-8"), "text/html", "utf-8", null);
                  } catch (Exception e) {
                      w.loadData("Erreur : index.html introuvable", "text/plain", "utf-8");
                  }
              }

              @Override public void onBackPressed() { if (w.canGoBack()) w.goBack(); else super.onBackPressed(); }
              @Override protected void onResume() { super.onResume(); surveillerSecousses(true); }
              @Override protected void onPause() { surveillerSecousses(false); super.onPause(); }

              SensorManager capteurs;
              SensorEventListener secousse;
              long derniereSecousse = 0;
              int nbSecousses = 0;
              void surveillerSecousses(boolean actif) {
                  if (capteurs == null) capteurs = getSystemService(SensorManager.class);
                  if (capteurs == null) return;
                  if (secousse == null) secousse = new SensorEventListener() {
                      @Override public void onSensorChanged(SensorEvent e) {
                          float x = e.values[0] / 9.81f, y = e.values[1] / 9.81f, z = e.values[2] / 9.81f;
                          if (Math.sqrt(x * x + y * y + z * z) < 2.5) return;
                          long t = System.currentTimeMillis();
                          if (t - derniereSecousse < 150) return;
                          if (t - derniereSecousse > 1500) nbSecousses = 0;
                          derniereSecousse = t;
                          if (++nbSecousses >= 3) { nbSecousses = 0; w.evaluateJavascript("window.ouvrirSignalement && ouvrirSignalement()", null); }
                      }
                      @Override public void onAccuracyChanged(Sensor s, int a) { }
                  };
                  Sensor acc = capteurs.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  if (actif && acc != null) capteurs.registerListener(secousse, acc, SensorManager.SENSOR_DELAY_UI);
                  else capteurs.unregisterListener(secousse);
              }

              class Pont {
                  @JavascriptInterface public void signalerErreur(String texte) {
                      Intent i = new Intent("fr.hack68.playstoore.ERREUR");
                      i.setPackage("fr.hack68.playstoore");
                      i.putExtra("paquet", getPackageName());
                      i.putExtra("texte", texte);
                      sendBroadcast(i);
                  }
                  @JavascriptInterface public void message(String t) { runOnUiThread(() -> Toast.makeText(MainActivity.this, t, Toast.LENGTH_SHORT).show()); }
                  @JavascriptInterface public void vibrer(int ms) { Vibrator v = getSystemService(Vibrator.class); if (v != null) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE)); }

                  @JavascriptInterface public void lireTexte(final String url, final String idRequete) {
                      new Thread(() -> {
                          String corps = ""; int statut = 0;
                          try {
                              java.net.HttpURLConnection c = (java.net.HttpURLConnection) new java.net.URL(url).openConnection();
                              c.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36");
                              c.setConnectTimeout(15000); c.setReadTimeout(20000);
                              statut = c.getResponseCode();
                              java.io.InputStream is = (statut >= 400) ? c.getErrorStream() : c.getInputStream();
                              if (is != null) {
                                  java.io.ByteArrayOutputStream o = new java.io.ByteArrayOutputStream();
                                  byte[] buf = new byte[8192]; int n;
                                  while ((n = is.read(buf)) > 0) o.write(buf, 0, n);
                                  corps = o.toString("UTF-8");
                              }
                          } catch (Exception e) { corps = String.valueOf(e.getMessage()); statut = 0; }
                          try {
                              org.json.JSONObject arg = new org.json.JSONObject();
                              arg.put("id", idRequete); arg.put("statut", statut); arg.put("corps", corps);
                              final String appel = "window.__reponse && window.__reponse(" + arg.toString() + ")";
                              runOnUiThread(() -> w.evaluateJavascript(appel, null));
                          } catch (Exception ignore) { }
                      }).start();
                  }

                  @JavascriptInterface public void notifier(String titre, String texte) {
                      try {
                          android.app.NotificationManager nm = getSystemService(android.app.NotificationManager.class);
                          if (nm == null) return;
                          android.app.Notification.Builder b;
                          if (android.os.Build.VERSION.SDK_INT >= 26) b = new android.app.Notification.Builder(MainActivity.this, "novartis_signal");
                          else b = new android.app.Notification.Builder(MainActivity.this);
                          b.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(titre).setContentText(texte)
                           .setStyle(new android.app.Notification.BigTextStyle().bigText(texte)).setAutoCancel(true);
                          Intent i = new Intent(MainActivity.this, MainActivity.class);
                          i.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          b.setContentIntent(android.app.PendingIntent.getActivity(MainActivity.this, 0, i, android.app.PendingIntent.FLAG_IMMUTABLE | android.app.PendingIntent.FLAG_UPDATE_CURRENT));
                          nm.notify((int) (System.currentTimeMillis() & 0xFFFFFF), b.build());
                      } catch (Exception ignore) { }
                  }

                  @JavascriptInterface public void ouvrirLien(String url) {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, android.net.Uri.parse(url))); } catch (Exception ignore) { }
                  }

                  @JavascriptInterface public void configurerAlertes(String json) {
                      try { VeilleJob.configurer(MainActivity.this, json); }
                      catch (Exception e) { signalerErreur("Alertes : réglages refusés : " + e); }
                  }

                  @JavascriptInterface public String etatAlertes() {
                      try {
                          android.content.SharedPreferences sp = VeilleJob.prefs(MainActivity.this);
                          android.app.job.JobScheduler js = getSystemService(android.app.job.JobScheduler.class);
                          android.app.NotificationManager nm = getSystemService(android.app.NotificationManager.class);
                          return new org.json.JSONObject()
                                  .put("bilan", sp.getString("bilan", ""))
                                  .put("erreur", sp.getString("erreur", ""))
                                  .put("planifie", js != null && js.getPendingJob(VeilleJob.ID) != null)
                                  .put("notifications", nm != null && nm.areNotificationsEnabled())
                                  .toString();
                      } catch (Exception e) { return "{}"; }
                  }

                  @JavascriptInterface public void testerAlertes() {
                      new Thread(() -> {
                          VeilleJob.notifier(MainActivity.this, 100, "Test : les alertes marchent ✓", "Tu recevras ce genre de message quand un de tes seuils sera franchi.");
                          String resultat = "ok";
                          try { VeilleJob.verifier(getApplicationContext(), true); }
                          catch (Exception e) { resultat = String.valueOf(e); VeilleJob.prefs(MainActivity.this).edit().putString("erreur", VeilleJob.heure() + " : " + resultat).apply(); }
                          final String appel = "window.__alertesTestees && window.__alertesTestees(" + org.json.JSONObject.quote(resultat) + ")";
                          runOnUiThread(() -> w.evaluateJavascript(appel, null));
                      }).start();
                  }
              }
          }
          EOF_8
          mkdir -p "$(dirname "app/src/main/java/fr/hack68/novartis/VeilleJob.java")"
          cat > 'app/src/main/java/fr/hack68/novartis/VeilleJob.java' <<'EOF_9'
          package fr.hack68.novartis;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.job.JobInfo;
          import android.app.job.JobParameters;
          import android.app.job.JobScheduler;
          import android.app.job.JobService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.ArrayList;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Veille des alertes : toutes les 30 min, du lundi au vendredi de 8h45 à 22h30 (heure de Paris), même appli fermée. */
          public class VeilleJob extends JobService {
              static final int ID = 7;
              static final String CANAL = "novartis_alertes";

              @Override
              public boolean onStartJob(JobParameters p) {
                  new Thread(() -> {
                      Context c = getApplicationContext();
                      try {
                          verifier(c, false);
                      } catch (Throwable t) {
                          String texte = String.valueOf(t);
                          SharedPreferences sp = prefs(c);
                          if (!texte.equals(sp.getString("dejaSignale", ""))) {
                              signaler(c, texte);
                              sp.edit().putString("dejaSignale", texte).apply();
                          }
                          sp.edit().putString("erreur", heure() + " : " + texte).apply();
                      }
                      jobFinished(p, false);
                  }).start();
                  return true;
              }

              @Override
              public boolean onStopJob(JobParameters p) { return true; }

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences("alertes", Context.MODE_PRIVATE); }

              static String heure() { return java.time.LocalDateTime.now().format(java.time.format.DateTimeFormatter.ofPattern("dd/MM HH:mm")); }

              static String nombre(double v) { return String.format(Locale.FRANCE, "%.2f", v); }

              static void planifier(Context c, boolean actif) {
                  JobScheduler js = c.getSystemService(JobScheduler.class);
                  if (js == null) return;
                  if (!actif) { js.cancel(ID); return; }
                  if (js.getPendingJob(ID) != null) return;
                  js.schedule(new JobInfo.Builder(ID, new ComponentName(c, VeilleJob.class))
                          .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                          .setPeriodic(30 * 60 * 1000L)
                          .setPersisted(true)
                          .build());
              }

              /** Réglages venus de l'écran. Un seuil qui change est réarmé : il pourra prévenir à nouveau. */
              static void configurer(Context c, String json) throws Exception {
                  SharedPreferences sp = prefs(c);
                  JSONObject avant = new JSONObject(sp.getString("config", "{}")), apres = new JSONObject(json);
                  SharedPreferences.Editor e = sp.edit().putString("config", json);
                  for (String cle : new String[]{"vlBas", "vlHaut", "nvsBas", "nvsHaut"})
                      if (avant.optDouble(cle, -1) != apres.optDouble(cle, -1)) e.remove("dit_" + cle);
                  if (avant.optDouble("variation", -1) != apres.optDouble("variation", -1)) e.remove("jour_novn").remove("jour_nvs");
                  if (avant.optBoolean("voyant", false) != apres.optBoolean("voyant", false)) e.remove("direction_couleur").remove("direction_jour");
                  e.apply();
                  planifier(c, apres.optBoolean("actif", false));
              }

              /** Une série de cours Yahoo : horodatages, jours de séance, clôtures et clôtures ajustées des dividendes. */
              static class Serie {
                  final ArrayList<Long> t = new ArrayList<>();
                  final ArrayList<String> j = new ArrayList<>();
                  final ArrayList<Double> c = new ArrayList<>();
                  final ArrayList<Double> a = new ArrayList<>();
                  double dernier() { return c.get(c.size() - 1); }
                  String jour() { return j.get(j.size() - 1); }
                  Double variation() { int n = c.size(); return n > 1 ? (c.get(n - 1) / c.get(n - 2) - 1) * 100 : null; }
              }

              static String lire(String url) throws Exception {
                  java.net.HttpURLConnection c = (java.net.HttpURLConnection) new java.net.URL(url).openConnection();
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36");
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(20000);
                  int statut = c.getResponseCode();
                  if (statut != 200) throw new Exception("Yahoo a répondu " + statut);
                  try (java.io.InputStream in = c.getInputStream()) {
                      java.io.ByteArrayOutputStream o = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                      return o.toString("UTF-8");
                  }
              }

              static Serie charger(String symbole, String periode) throws Exception {
                  String chemin = "/v8/finance/chart/" + symbole + "?range=" + periode + "&interval=1d&includePrePost=false&events=div%2Csplits";
                  String corps;
                  try { corps = lire("https://query1.finance.yahoo.com" + chemin); }
                  catch (Exception e) { corps = lire("https://query2.finance.yahoo.com" + chemin); }
                  return lireSerie(corps, symbole);
              }

              /** Même lecture que l'écran : on saute les cours vides, une séance en double garde la plus récente. */
              static Serie lireSerie(String corps, String symbole) throws Exception {
                  JSONObject chart;
                  try { chart = new JSONObject(corps).getJSONObject("chart"); }
                  catch (Exception e) { throw new Exception(symbole + " : réponse illisible (" + corps.substring(0, Math.min(120, corps.length())) + ")"); }
                  JSONArray resultats = chart.optJSONArray("result");
                  if (resultats == null || resultats.optJSONObject(0) == null) {
                      JSONObject err = chart.optJSONObject("error");
                      throw new Exception(symbole + " : " + (err != null ? err.optString("description", "aucune donnée") : "aucune donnée"));
                  }
                  JSONObject r = resultats.getJSONObject(0);
                  JSONObject meta = r.optJSONObject("meta");
                  long decalage = meta != null ? meta.optLong("gmtoffset", 0) : 0;
                  JSONArray ts = r.optJSONArray("timestamp");
                  JSONObject ind = r.getJSONObject("indicators");
                  JSONArray cl = ind.getJSONArray("quote").getJSONObject(0).getJSONArray("close");
                  JSONArray liste = ind.optJSONArray("adjclose");
                  JSONArray adj = liste != null && liste.optJSONObject(0) != null ? liste.optJSONObject(0).optJSONArray("adjclose") : null;
                  Serie s = new Serie();
                  for (int i = 0; ts != null && i < ts.length(); i++) {
                      double v = cl.optDouble(i, Double.NaN);
                      if (Double.isNaN(v) || v <= 0) continue;
                      double va = adj != null ? adj.optDouble(i, v) : v;
                      if (Double.isNaN(va) || va <= 0) va = v;
                      long t = ts.getLong(i);
                      String jour = java.time.Instant.ofEpochSecond(t + decalage + 6 * 3600).toString().substring(0, 10);
                      int n = s.j.size();
                      if (n > 0 && s.j.get(n - 1).equals(jour)) { s.t.remove(n - 1); s.j.remove(n - 1); s.c.remove(n - 1); s.a.remove(n - 1); }
                      s.t.add(t);
                      s.j.add(jour);
                      s.c.add(v);
                      s.a.add(va);
                  }
                  if (s.c.isEmpty()) throw new Exception(symbole + " : aucun cours");
                  return s;
              }

              /** Même calcul que l'écran : VL connue × variation de l'action Zurich en euros (cours ajusté du jour de la VL). */
              static Double estimerVL(Serie novn, Serie fx, double vlRef, String jourRef) {
                  int k = -1;
                  for (int i = 0; i < novn.j.size(); i++) { if (novn.j.get(i).compareTo(jourRef) <= 0) k = i; else break; }
                  if (k < 0) return null;
                  Double fxRef = null;
                  for (int i = 0; i < fx.t.size(); i++) { if (fx.t.get(i) <= novn.t.get(k) + 6 * 3600) fxRef = fx.c.get(i); else break; }
                  if (fxRef == null) return null;
                  return vlRef * (novn.a.get(novn.a.size() - 1) / fx.dernier()) / (novn.a.get(k) / fxRef);
              }

              static boolean atteint(double valeur, double seuil, boolean bas) { return bas ? valeur <= seuil : valeur >= seuil; }

              static boolean rearme(double valeur, double seuil, boolean bas) { return bas ? valeur > seuil * 1.005 : valeur < seuil * 0.995; }

              static synchronized void verifier(Context c, boolean force) throws Exception {
                  SharedPreferences sp = prefs(c);
                  JSONObject cfg = new JSONObject(sp.getString("config", "{}"));
                  if (!force && !cfg.optBoolean("actif", false)) return;
                  java.time.ZonedDateTime m = java.time.ZonedDateTime.now(java.time.ZoneId.of("Europe/Paris"));
                  int minutes = m.getHour() * 60 + m.getMinute();
                  if (!force && (m.getDayOfWeek().getValue() >= 6 || minutes < 8 * 60 + 45 || minutes > 22 * 60 + 30)) return; // Bourses fermées
                  double vlRef = cfg.optDouble("vlRef", 0);
                  String jourRef = cfg.optString("vlDate", "");
                  boolean avecVL = vlRef > 0 && jourRef.length() == 10;
                  String periode = "5d";
                  if (avecVL) {
                      long age = java.time.temporal.ChronoUnit.DAYS.between(java.time.LocalDate.parse(jourRef), java.time.LocalDate.now());
                      periode = age <= 80 ? "3mo" : (age <= 350 ? "1y" : "max");
                  }
                  StringBuilder bilan = new StringBuilder(heure());
                  Serie novn = charger("NOVN.SW", periode);
                  if (avecVL) {
                      Double vl = estimerVL(novn, charger("EURCHF=X", periode), vlRef, jourRef);
                      if (vl != null) {
                          bilan.append(" · VL ≈ ").append(nombre(vl)).append(" €");
                          seuil(c, sp, cfg, "vlBas", vl, true, "VL du FCPE", "€", 101);
                          seuil(c, sp, cfg, "vlHaut", vl, false, "VL du FCPE", "€", 102);
                      } else bilan.append(" · VL : date de ta VL trop ancienne");
                  }
                  Serie nvs = charger("NVS", "5d");
                  bilan.append(" · NVS ").append(nombre(nvs.dernier())).append(" $");
                  seuil(c, sp, cfg, "nvsBas", nvs.dernier(), true, "NVS", "$", 103);
                  seuil(c, sp, cfg, "nvsHaut", nvs.dernier(), false, "NVS", "$", 104);
                  mouvement(c, sp, cfg, "novn", "Novartis à Zurich", novn, 105);
                  mouvement(c, sp, cfg, "nvs", "NVS à New York", nvs, 106);
                  voyant(c, sp, cfg, m, minutes, force, bilan);
                  sp.edit().putString("bilan", bilan.toString()).putString("erreur", "").putString("dejaSignale", "").apply();
              }

              /** Prévient une fois quand la valeur passe le seuil ; se réarme quand elle repart de plus de 0,5 % dans l'autre sens. */
              static void seuil(Context c, SharedPreferences sp, JSONObject cfg, String cle, double valeur, boolean bas, String quoi, String unite, int id) {
                  double limite = cfg.optDouble(cle, 0);
                  if (!(limite > 0)) return;
                  boolean dit = sp.getBoolean("dit_" + cle, false);
                  if (!dit && atteint(valeur, limite, bas)) {
                      notifier(c, id, quoi + (bas ? " sous " : " au-dessus de ") + nombre(limite) + " " + unite, "Maintenant : " + nombre(valeur) + " " + unite + ".");
                      sp.edit().putBoolean("dit_" + cle, true).apply();
                  } else if (dit && rearme(valeur, limite, bas)) {
                      sp.edit().putBoolean("dit_" + cle, false).apply();
                  }
              }

              /** Grosse variation sur la séance : une seule alerte par séance et par Bourse. */
              static void mouvement(Context c, SharedPreferences sp, JSONObject cfg, String cle, String nom, Serie s, int id) {
                  double limite = cfg.optDouble("variation", 0);
                  Double v = s.variation();
                  if (!(limite > 0) || v == null || Math.abs(v) < limite) return;
                  if (s.jour().equals(sp.getString("jour_" + cle, ""))) return;
                  String jour = s.jour().substring(8, 10) + "/" + s.jour().substring(5, 7);
                  notifier(c, id, nom + " : " + (v > 0 ? "+" : "") + nombre(v) + " %", "Séance du " + jour + ". Ton seuil : ±" + nombre(limite) + " %.");
                  sp.edit().putString("jour_" + cle, s.jour()).apply();
              }

              /** Direction à court terme : 4 vérifications sur l'action à Zurich, mêmes règles que l'écran. null si pas assez d'historique. */
              static String couleurVoyant(ArrayList<Double> a) {
                  int n = a.size();
                  if (n < 25) return null;
                  double p = a.get(n - 1), m10 = 0, m20 = 0;
                  for (int i = n - 10; i < n; i++) m10 += a.get(i);
                  for (int i = n - 20; i < n; i++) m20 += a.get(i);
                  m10 /= 10;
                  m20 /= 20;
                  int debut = Math.max(0, n - 100), k = 14;
                  double g = 0, q = 0;
                  for (int i = debut + 1; i <= debut + k; i++) { double d = a.get(i) - a.get(i - 1); if (d > 0) g += d; else q -= d; }
                  g /= k;
                  q /= k;
                  for (int i = debut + k + 1; i < n; i++) { double d = a.get(i) - a.get(i - 1); g = (g * (k - 1) + (d > 0 ? d : 0)) / k; q = (q * (k - 1) + (d < 0 ? -d : 0)) / k; }
                  double rsi = q == 0 ? (g == 0 ? 50 : 100) : 100 - 100 / (1 + g / q);
                  int score = (p > a.get(n - 6) ? 1 : 0) + (p > m10 ? 1 : 0) + (m10 > m20 ? 1 : 0) + (rsi < 70 ? 1 : 0);
                  return score >= 3 ? "vert" : (score == 2 ? "orange" : "rouge");
              }

              /** Chaque soir après la clôture de Zurich (17h45) : prévient si la direction prévue change. */
              static void voyant(Context c, SharedPreferences sp, JSONObject cfg, java.time.ZonedDateTime m, int minutes, boolean force, StringBuilder bilan) throws Exception {
                  if (!cfg.optBoolean("voyant", false)) return;
                  String aujourdhui = m.toLocalDate().toString();
                  if (!force && (minutes < 17 * 60 + 45 || aujourdhui.equals(sp.getString("direction_jour", "")))) return;
                  String couleur = couleurVoyant(charger("NOVN.SW", "1y").a);
                  if (couleur == null) return;
                  String[] noms = {"vert", "plutôt hausse", "orange", "indécis", "rouge", "plutôt baisse"};
                  String nom = couleur.equals("vert") ? noms[1] : (couleur.equals("orange") ? noms[3] : noms[5]);
                  bilan.append(" · direction ").append(nom);
                  String avant = sp.getString("direction_couleur", "");
                  if (!avant.isEmpty() && !avant.equals(couleur)) {
                      String[] t = couleur.equals("vert") ? new String[]{"🟢 Novartis : plutôt hausse", "La plupart des indicateurs penchent vers la hausse."}
                              : couleur.equals("orange") ? new String[]{"🟠 Novartis : indécis", "Les indicateurs se contredisent : plutôt attendre."}
                              : new String[]{"🔴 Novartis : plutôt baisse", "La plupart des indicateurs penchent vers la baisse."};
                      String nomAvant = avant.equals("vert") ? noms[1] : (avant.equals("orange") ? noms[3] : noms[5]);
                      notifier(c, 107, t[0], t[1] + " (avant : " + nomAvant + ")");
                  }
                  SharedPreferences.Editor e = sp.edit().putString("direction_couleur", couleur);
                  if (!force) e.putString("direction_jour", aujourdhui);
                  e.apply();
              }

              static void notifier(Context c, int id, String titre, String texte) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null) return;
                  nm.createNotificationChannel(new NotificationChannel(CANAL, "Alertes de cours", NotificationManager.IMPORTANCE_HIGH));
                  Intent i = new Intent(c, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  nm.notify(id, new Notification.Builder(c, CANAL)
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(titre)
                          .setContentText(texte)
                          .setStyle(new Notification.BigTextStyle().bigText(texte))
                          .setAutoCancel(true)
                          .setContentIntent(PendingIntent.getActivity(c, id, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT))
                          .build());
              }

              /** Une erreur de la veille part au mouchard de Playstoore (une seule fois par erreur différente). */
              static void signaler(Context c, String texte) {
                  try {
                      Intent i = new Intent("fr.hack68.playstoore.ERREUR");
                      i.setPackage("fr.hack68.playstoore");
                      i.putExtra("paquet", c.getPackageName());
                      i.putExtra("texte", "Veille des alertes en arrière-plan : " + texte);
                      c.sendBroadcast(i);
                  } catch (Exception ignore) { }
              }
          }
          EOF_9
