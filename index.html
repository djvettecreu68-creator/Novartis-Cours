<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Novartis Cours</title>
<style>
:root{--fond:#F3F5F7;--txt:#162028;--prim:#0B5FA5;--carte:#FFFFFF;--bord:#D8DEE3;--rouge:#C0392B;--vert:#1E8449;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--fond:#12171C;--txt:#E9EEF1;--carte:#1B232B;--bord:#2A3540;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--txt);font:16px/1.45 system-ui,sans-serif;padding:16px 16px calc(80px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.45rem;margin:0 0 4px}
.sous{color:#6B7785;font-size:.9rem;margin-bottom:16px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:18px;padding:16px;margin-bottom:14px}
select,button,input[type="date"],input[type="number"]{font:inherit;border-radius:12px;border:1px solid var(--bord);padding:10px 12px;background:var(--carte);color:var(--txt)}
button{background:var(--prim);color:#fff;border:0;font-weight:700;min-height:44px;padding:0 18px}
button:active{opacity:.85}
button:disabled{opacity:.5}
.ligne{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:.95rem}
canvas{width:100%;height:260px;display:block}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:7px 5px;border-bottom:1px solid var(--bord);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:#6B7785;font-weight:600;font-size:.8rem}
#message{font-size:.88rem;color:#6B7785;margin-top:8px;min-height:1.2em}
#progression{font-size:.85rem;color:var(--prim);margin-top:6px}
#controle{font-size:.78rem;color:#6B7785;padding:10px 2px;text-align:center}
#signal-badge{font-size:1.6rem;font-weight:800;text-align:center;padding:22px;border-radius:16px;margin-bottom:8px;letter-spacing:.02em}
#signal-confiance{text-align:center;font-size:.9rem;font-weight:700;margin-bottom:12px}
#signal-detail>div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--bord);font-size:.85rem}
#signal-detail>div:last-child{border-bottom:0}
#actus>div{padding:9px 0;border-bottom:1px solid var(--bord);cursor:pointer}
#actus>div:last-child{border-bottom:0}
#actus .actu-titre{font-weight:600;font-size:.9rem;line-height:1.3}
#actus .actu-meta{color:#6B7785;font-size:.75rem;margin-top:3px}
#actus .actu-pos{color:var(--vert);font-weight:700}
#actus .actu-neg{color:var(--rouge);font-weight:700}
.risque-box{margin-top:10px;padding:12px;background:rgba(11,95,165,.08);border-radius:12px;font-size:.85rem;border-left:4px solid var(--prim)}
.risque-box b{display:block;margin-bottom:4px}
</style>
</head>
<body>
<h1>Novartis Cours</h1>
<div class="sous">Analyse Multi-Timeframes (1D + 1H) & Gestion du Risque</div>

<div class="carte">
  <div class="ligne">
    <label for="intervalle">Précision</label>
    <select id="intervalle">
      <option value="1d">Journalier (Tendance)</option>
      <option value="1h">Horaire (Momentum)</option>
    </select>
    <label for="periode">Afficher</label>
    <select id="periode">
      <option value="1mo">1 mois</option>
      <option value="3mo" selected>3 mois</option>
      <option value="6mo">6 mois</option>
      <option value="1y">1 an</option>
      <option value="max">Tout</option>
    </select>
  </div>
  <div class="ligne" style="margin-top:10px">
    <input type="checkbox" id="auto" style="width:22px;height:22px" checked>
    <label for="auto">Surveillance en arrière-plan (24/7)</label>
  </div>
  <div class="ligne" style="margin-top:10px">
    <button id="charger" style="flex:2">Tout actualiser maintenant</button>
    <button id="vider" style="flex:1;background:#D2463A">Vider le cache</button>
  </div>
  <div id="message"></div>
  <div id="progression"></div>
</div>

<div class="carte">
  <div style="font-size:1.1rem;font-weight:700;margin-bottom:12px">Mon Épargne (FCPE Natixis)</div>
  <div class="ligne" style="margin-bottom:10px">
    <label for="vl_date" style="width:100%">Date de la VL :</label>
    <input type="date" id="vl_date" style="flex:1">
  </div>
  <div class="ligne" style="margin-bottom:10px">
    <label for="vl_ref" style="width:100%">Montant de la VL (€) :</label>
    <input type="number" id="vl_ref" step="0.001" value="109.657" style="flex:1">
    <button id="sauver_vl" style="padding:8px 12px;min-height:auto">OK</button>
  </div>
  <div id="resultat_vl" style="font-size:1.1rem;text-align:center;padding:12px;background:var(--fond);border-radius:12px">
    Valeur actuelle estimée : <br><b style="font-size:1.4rem;color:var(--prim)">— €</b>
  </div>
  <div style="font-size:.72rem;color:#8B959E;margin-top:8px;text-align:center">Estimation basée sur la variation de l'action.</div>
</div>

<div class="carte">
  <div style="font-size:1.1rem;font-weight:700;margin-bottom:12px">Décision Algorithmique</div>
  <div id="signal-badge">—</div>
  <div id="signal-confiance"></div>
  <div id="risque"></div>
  <div id="signal-explication" style="font-size:.88rem;color:#6B7785;margin-top:12px;margin-bottom:12px;text-align:center"></div>
  <div id="signal-detail"></div>
</div>

<div class="carte">
  <div style="font-size:1.1rem;font-weight:700;margin-bottom:8px">Backtesting (5 dernières années)</div>
  <div id="backtest" style="font-size:.9rem;color:#6B7785">Calcul en cours…</div>
</div>

<div class="carte">
  <canvas id="graphique"></canvas>
</div>

<div class="carte">
  <div style="font-size:1.1rem;font-weight:700;margin-bottom:8px">Actualité récente</div>
  <div id="actus"></div>
</div>

<div class="carte" style="overflow-x:auto">
  <table>
    <thead>
      <tr><th>Date</th><th>Ouv.</th><th>Haut</th><th>Bas</th><th>Clôt.</th><th>Ajusté</th><th>Vol.</th></tr>
    </thead>
    <tbody id="tableau"></tbody>
  </table>
</div>

<div id="controle"></div>

<script>
// Mouchard v3
(function () {
  if (window.__mouchard) return; window.__mouchard = 3;
  const gestes = [], dejaVu = {};
  const heure = () => new Date().toLocaleTimeString('fr-FR');
  const couper = (t, n) => { t = String(t == null ? '' : t); return t.length > n ? t.slice(0, n) + '…' : t; };
  const noter = (t) => { gestes.push(heure() + ' ' + couper(t, 160)); if (gestes.length > 12) gestes.shift(); };
  const photo = () => {
    const champs = [...document.querySelectorAll('input, select, textarea')]
      .filter((c) => !c.closest('#__signal') && c.type !== 'password')
      .slice(0, 20).map((c) => '#' + (c.id || c.name || c.tagName.toLowerCase()) + ' = « ' + couper(c.type === 'checkbox' ? c.checked : c.value, 60) + ' »');
    const donnees = {};
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); donnees[k] = couper(localStorage.getItem(k), 400); } } catch (e) { }
    return { gestes: gestes.slice(), champs, ecran: couper(((document.body && document.body.innerText) || '').replace(/\n{2,}/g, '\n'), 1500),
      donnees: couper(JSON.stringify(donnees), 2000), appareil: couper(navigator.userAgent, 200), titre: document.title };
  };
  const envoyer = (type, message, ligne, colonne, pile, plus) => {
    if (!ligne && pile) { const m = String(pile).match(/:(\d+):(\d+)\)?\s*$/m); if (m) { ligne = +m[1]; colonne = +m[2]; } }
    const cle = type + '|' + message + '|' + ligne, maintenant = Date.now();
    if (dejaVu[cle] && maintenant - dejaVu[cle] < 3000) return false;
    dejaVu[cle] = maintenant;
    if (!(window.Android && Android.signalerErreur)) return false;
    Android.signalerErreur(JSON.stringify(Object.assign({ type, message: couper(message, 500), ligne: ligne || 0, colonne: colonne || 0,
      pile: couper(pile, 1500) }, photo(), plus || {})));
    return true;
  };
  document.addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('button, a, input, select, label, [onclick], [role="button"]');
    if (!b || b.closest('#__signal')) return;
    const texte = (b.innerText || b.value || b.getAttribute('aria-label') || '').trim().replace(/\s+/g, ' ').slice(0, 40);
    noter('touche « ' + (texte || b.tagName.toLowerCase()) + ' »' + (b.id ? ' (#' + b.id + ')' : ''));
  }, true);
  document.addEventListener('change', (e) => {
    const c = e.target; if (!c || !c.tagName || c.closest('#__signal')) return;
    noter('change ' + c.tagName.toLowerCase() + (c.id ? ' #' + c.id : '') + ' = « ' + String(c.type === 'checkbox' ? c.checked : c.value).slice(0, 30) + ' »');
  }, true);
  window.addEventListener('error', (e) => envoyer('ecran', e.message || 'Erreur', e.lineno, e.colno, e.error && e.error.stack));
  window.addEventListener('unhandledrejection', (e) => { const r = e.reason; envoyer('ecran', 'Promesse rejetée : ' + ((r && r.message) || r), 0, 0, r && r.stack); });
  const consoleErreur = console.error;
  console.error = (...a) => { consoleErreur.apply(console, a); envoyer('console', 'console.error : ' + a.map(String).join(' '), 0, 0, new Error().stack); };
  function ouvrirSignalement() {
    if (document.getElementById('__signal')) return; noter('ouvre « Signaler un problème »');
    const instantane = photo();
    const d = document.createElement('div'); d.id = '__signal';
    d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;font:16px/1.4 system-ui,sans-serif';
    d.innerHTML = '<div style="background:#fff;color:#111;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px">'
      + '<b style="font-size:1.15rem">🐞 Signaler un problème</b>'
      + '<span style="color:#555;font-size:.9rem">Dis en une phrase ce qui ne va pas.</span>'
      + '<textarea id="__signalTexte" rows="3" style="font:inherit;color:#111;background:#fff;border:1px solid #bbb;border-radius:12px;padding:10px" placeholder="Ex. : le backtest ne s’affiche pas"></textarea>'
      + '<div style="display:flex;gap:10px"><button id="__signalNon" style="flex:1;height:46px;border:0;border-radius:23px;background:#e6e6e6;color:#111;font:inherit;font-weight:700">Annuler</button>'
      + '<button id="__signalOui" style="flex:2;height:46px;border:0;border-radius:23px;background:#D2463A;color:#fff;font:inherit;font-weight:700">Envoyer</button></div></div>';
    document.body.appendChild(d);
    const zone = d.querySelector('#__signalTexte'); setTimeout(() => zone.focus(), 50);
    d.querySelector('#__signalNon').onclick = () => d.remove();
    d.querySelector('#__signalOui').onclick = () => {
      const texte = zone.value.trim(); if (!texte) { zone.focus(); return; } d.remove();
      const ok = !!(window.Android && Android.signalerErreur);
      if (ok) Android.signalerErreur(JSON.stringify(Object.assign({ type: 'signalement', message: couper(texte, 500), ligne: 0, colonne: 0, pile: '' }, instantane)));
    };
  }
  window.ouvrirSignalement = ouvrirSignalement;
  let minuteur = null;
  document.addEventListener('touchstart', (e) => { if (e.target.closest && e.target.closest('h1')) minuteur = setTimeout(ouvrirSignalement, 800); }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach((t) => document.addEventListener(t, () => clearTimeout(minuteur), { passive: true }));
  noter('ouverture de l’appli');
})();

const requetesEnCours = {};
window.__reponse = (data) => {
  const p = requetesEnCours[data.id]; if (!p) return;
  delete requetesEnCours[data.id];
  if (data.statut >= 200 && data.statut < 400) p.resolve(data.corps);
  else p.reject(new Error('HTTP ' + data.statut));
};
function lire(url) {
  return new Promise((resolve, reject) => {
    if (window.Android && Android.lireTexte) {
      const id = 'r' + Math.random().toString(36).slice(2);
      requetesEnCours[id] = { resolve, reject };
      try { Android.lireTexte(url, id); }
      catch (e) { delete requetesEnCours[id]; reject(e); return; }
      setTimeout(() => { if (requetesEnCours[id]) { delete requetesEnCours[id]; reject(new Error('Timeout')); } }, 30000);
    } else reject(new Error('Pas de moyen de télécharger'));
  });
}

const JEUX = [
  { cle: '1d', interval: '1d', range: 'max', libelle: 'Journalier' },
  { cle: '1h', interval: '1h', range: '2y', libelle: 'Horaire' }
];
function urlCours(jeu) { return 'https://query1.finance.yahoo.com/v8/finance/chart/NVS?range=' + jeu.range + '&interval=' + jeu.interval + '&includePrePost=false&events=div%2Csplits'; }
const URL_NEWS_FR = 'https://news.google.com/rss/search?q=Novartis+when:7d&hl=fr&gl=FR&ceid=FR:fr';
const URL_NEWS_EN = 'https://feeds.finance.yahoo.com/rss/2.0/headline?s=NVS&region=US&lang=en-US';

const PREFIXE_CACHE = 'novartis.v2.';
const CLE_AUTO = 'novartis.auto';
const CLE_ACTUS = 'novartis.actus';
const etat = { intervalle: '1d', jeux: {}, actus: [] };

function cleCache(cle) { return PREFIXE_CACHE + cle; }
function lireCache(cle) {
  try {
    const brut = localStorage.getItem(cleCache(cle));
    if (!brut) return null;
    const data = JSON.parse(brut);
    if (!data || !Array.isArray(data.points) || !data.points.length) return null;
    return data;
  } catch (e) { return null; }
}
function ecrireCache(cle, data) {
  try { localStorage.setItem(cleCache(cle), JSON.stringify({ devise: data.devise || 'USD', dateMax: Date.now(), points: data.points })); return true; }
  catch (e) { return false; }
}
function filtrerPoints(points, periode, maintenantMs) {
  if (!points || !points.length) return [];
  if (periode === 'max') return points.slice();
  const moisParPeriode = { '1mo': 1, '3mo': 3, '6mo': 6, '1y': 12, '5y': 60 };
  const mois = moisParPeriode[periode];
  if (!mois) return points.slice();
  const d = new Date(maintenantMs || Date.now());
  d.setUTCMonth(d.getUTCMonth() - mois);
  return points.filter((p) => p.timestamp >= Math.floor(d.getTime() / 1000));
}
function formaterNombre(v) {
  if (v == null || isNaN(v)) return '—';
  return Number(v).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formaterDate(ts, intervalle) {
  const d = new Date(ts * 1000);
  if (intervalle === '1d') return d.toLocaleDateString('fr-FR');
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

// ===== INDICATEURS TECHNIQUES =====
function valeurPoint(p) { return p.adjclose != null ? p.adjclose : p.close; }
function sma(points, n) {
  if (!points || points.length < n) return null;
  let somme = 0;
  for (let i = points.length - n; i < points.length; i++) somme += valeurPoint(points[i]);
  return somme / n;
}
function ema(points, n) {
  const k = 2 / (n + 1); const out = []; let prev = null;
  for (let i = 0; i < points.length; i++) {
    const v = valeurPoint(points[i]);
    if (i === 0) { prev = v; out.push(v); }
    else { prev = v * k + prev * (1 - k); out.push(prev); }
  }
  return out;
}
function rsi(points, n) {
  n = n || 14;
  if (!points || points.length < n + 1) return null;
  let gains = 0, pertes = 0;
  for (let i = 1; i <= n; i++) {
    const d = valeurPoint(points[i]) - valeurPoint(points[i - 1]);
    if (d > 0) gains += d; else pertes += -d;
  }
  let moyGain = gains / n, moyPerte = pertes / n;
  for (let i = n + 1; i < points.length; i++) {
    const d = valeurPoint(points[i]) - valeurPoint(points[i - 1]);
    const g = d > 0 ? d : 0, p = d < 0 ? -d : 0;
    moyGain = (moyGain * (n - 1) + g) / n;
    moyPerte = (moyPerte * (n - 1) + p) / n;
  }
  if (moyPerte === 0) return moyGain === 0 ? 50 : 100;
  return 100 - 100 / (1 + (moyGain / moyPerte));
}
function macd(points) {
  if (!points || points.length < 35) return null;
  const e12 = ema(points, 12), e26 = ema(points, 26);
  const ligne = e12.map((v, i) => v - e26[i]);
  const faussPts = ligne.slice(25).map((v) => ({ close: v, adjclose: null }));
  const sig = ema(faussPts, 9);
  return { ligne: ligne[ligne.length - 1], signal: sig[sig.length - 1], histogramme: ligne[ligne.length - 1] - sig[sig.length - 1] };
}
function atr(points, n) {
  n = n || 14;
  if (!points || points.length < n + 1) return null;
  let trs = [];
  for (let i = 1; i < points.length; i++) {
    const high = points[i].high, low = points[i].low, prevClose = points[i - 1].close;
    trs.push(Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose)));
  }
  let atr = trs.slice(0, n).reduce((a, b) => a + b, 0) / n;
  for (let i = n; i < trs.length; i++) atr = (atr * (n - 1) + trs[i]) / n;
  return atr;
}
function adx(points, n) {
  n = n || 14;
  if (!points || points.length < n * 2) return null;
  let trs = [], plusDM = [], minusDM = [];
  for (let i = 1; i < points.length; i++) {
    const high = points[i].high, low = points[i].low, prevHigh = points[i - 1].high, prevLow = points[i - 1].low, prevClose = points[i - 1].close;
    trs.push(Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose)));
    const upMove = high - prevHigh, downMove = prevLow - low;
    plusDM.push(upMove > downMove && upMove > 0 ? upMove : 0);
    minusDM.push(downMove > upMove && downMove > 0 ? downMove : 0);
  }
  let smoothTR = trs.slice(0, n).reduce((a, b) => a + b, 0);
  let smoothPlus = plusDM.slice(0, n).reduce((a, b) => a + b, 0);
  let smoothMinus = minusDM.slice(0, n).reduce((a, b) => a + b, 0);
  let dxs = [];
  for (let i = n; i < trs.length; i++) {
    smoothTR = smoothTR - (smoothTR / n) + trs[i];
    smoothPlus = smoothPlus - (smoothPlus / n) + plusDM[i];
    smoothMinus = smoothMinus - (smoothMinus / n) + minusDM[i];
    const diPlus = 100 * (smoothPlus / smoothTR), diMinus = 100 * (smoothMinus / smoothTR);
    dxs.push(100 * Math.abs(diPlus - diMinus) / (diPlus + diMinus));
  }
  if (dxs.length < n) return null;
  let adxVal = dxs.slice(0, n).reduce((a, b) => a + b, 0) / n;
  for (let i = n; i < dxs.length; i++) adxVal = (adxVal * (n - 1) + dxs[i]) / n;
  return adxVal;
}

// ===== MOTEUR DE DÉCISION =====
function analyserTitre(titre) {
  const t = String(titre || '').toLowerCase();
  const pos = ['beat', 'raise', 'approval', 'success', 'growth', 'upgrade', 'profit', 'breakthrough', 'record', 'approuv', 'hausse', 'bénéfice', 'succès', 'positif'];
  const neg = ['miss', 'downgrade', 'lawsuit', 'fail', 'recall', 'warning', 'loss', 'drop', 'plunge', 'fall', 'decline', 'reject', 'investigation', 'procès', 'échec', 'chute', 'baisse', 'perte'];
  let s = 0;
  for (const m of pos) if (t.includes(m)) s++;
  for (const m of neg) if (t.includes(m)) s--;
  return s;
}

function calculerSignal(journalier, horaire, actus) {
  if (!journalier || journalier.length < 200 || !horaire || horaire.length < 200) 
    return { ok: false, raison: 'Pas assez de données pour l\'analyse multi-timeframes.' };
  
  const close = valeurPoint(journalier[journalier.length - 1]);
  const mm200 = sma(journalier, 200);
  const adxJ = adx(journalier, 14);
  const at = atr(journalier, 14);
  
  const rsiH = rsi(horaire, 14);
  const macdH = macd(horaire);
  const mm50H = sma(horaire, 50);
  
  let score = 0;
  const details = [];

  let tendance = 'neutre';
  if (adxJ != null && mm200 != null) {
    if (close > mm200 && adxJ > 20) tendance = 'haussiere';
    else if (close < mm200 && adxJ > 20) tendance = 'baissiere';
  }
  let ptsTendance = tendance === 'haussiere' ? 30 : (tendance === 'baissiere' ? -30 : 0);
  score += ptsTendance;
  details.push({ nom: 'Tendance (1D)', valeur: tendance + ' (ADX ' + (adxJ ? adxJ.toFixed(1) : '—') + ')', pts: ptsTendance });

  let ptsMomentum = (mm50H && close > mm50H) ? 15 : -15;
  score += ptsMomentum;
  details.push({ nom: 'Momentum (1H)', valeur: mm50H ? 'Prix ' + (close > mm50H ? '>' : '<') + ' MM50' : '—', pts: ptsMomentum });

  let ptsRSI = rsiH <= 30 ? 25 : (rsiH >= 70 ? -25 : Math.round((50 - rsiH) / 2));
  score += ptsRSI;
  details.push({ nom: 'RSI (1H)', valeur: rsiH ? rsiH.toFixed(1) : '—', pts: ptsRSI });

  let ptsMACD = macdH && macdH.histogramme > 0 ? 15 : -15;
  score += ptsMACD;
  details.push({ nom: 'MACD (1H)', valeur: macdH ? macdH.histogramme.toFixed(3) : '—', pts: ptsMACD });

  let scoreNews = 0;
  for (const actu of actus) scoreNews += analyserTitre(actu.titre);
  let bonusNews = Math.max(-20, Math.min(20, scoreNews * 4));
  details.push({ nom: 'Actualités', valeur: actus.length + ' titres', pts: bonusNews });

  let scoreFinal = Math.max(-105, Math.min(105, score + bonusNews));
  let signal, couleur, explication, confiance;

  if (tendance === 'baissiere' && scoreFinal > 0) {
    signal = 'ATTENDRE'; couleur = 'attendre'; confiance = 'Bloqué';
    explication = 'Achats bloqués : tendance de fond baissière.';
  } else if (tendance === 'haussiere' && scoreFinal >= 40) {
    signal = 'ACHAT FORT'; couleur = 'fort-achat'; confiance = 'Haute';
    explication = 'Tendance de fond et momentum alignés à la hausse.';
  } else if (scoreFinal >= 15) {
    signal = 'ACHAT MODÉRÉ'; couleur = 'achat'; confiance = 'Moyenne';
    explication = 'Signaux haussiers, prudence recommandée.';
  } else if (scoreFinal <= -40) {
    signal = 'VENTE FORTE'; couleur = 'fort-vente'; confiance = 'Haute';
    explication = 'Tendance baissière confirmée.';
  } else if (scoreFinal <= -15) {
    signal = 'VENTE MODÉRÉE'; couleur = 'vente'; confiance = 'Moyenne';
    explication = 'Signaux baissiers.';
  } else {
    signal = 'ATTENDRE'; couleur = 'attendre'; confiance = 'Neutre';
    explication = 'Pas de direction claire, marché indécis.';
  }

  let stopLoss = null, takeProfit = null, ratioRR = null;
  if (at && signal.includes('ACHAT')) {
    stopLoss = close - (at * 1.5);
    takeProfit = close + (at * 3);
    ratioRR = '1 : 2';
  }

  return { ok: true, score: scoreFinal, signal, couleur, explication, confiance, details, close, stopLoss, takeProfit, ratioRR };
}

function lancerBacktest(journalier, horaire) {
  if (!journalier || journalier.length < 300) return null;
  let trades = 0, gagnants = 0, gainTotal = 0;
  for (let i = 200; i < journalier.length - 30; i += 5) {
    const sJ = journalier.slice(0, i + 1);
    const sH = sJ; 
    const s = calculerSignal(sJ, sH, []);
    if (s.ok && s.signal.includes('ACHAT')) {
      trades++;
      const sortie = valeurPoint(journalier[i + 30]);
      if (sortie > s.close) { gagnants++; gainTotal += (sortie - s.close) / s.close; }
    }
  }
  if (trades === 0) return { trades: 0, msg: 'Aucun signal.' };
  return { trades: trades, winRate: ((gagnants / trades) * 100).toFixed(1), gainMoyen: ((gainTotal / trades) * 100).toFixed(2) };
}

// ===== AFFICHAGE =====
function afficherSignal(s) {
  const badge = document.getElementById('signal-badge');
  const expl = document.getElementById('signal-explication');
  const detail = document.getElementById('signal-detail');
  const conf = document.getElementById('signal-confiance');
  const risque = document.getElementById('risque');
  
  if (!s || !s.ok) {
    badge.textContent = '—'; badge.style.background = '#B5BCC3'; badge.style.color = '#2B3338';
    expl.textContent = s && s.raison ? s.raison : 'Aucune donnée.'; detail.innerHTML = ''; conf.textContent = ''; risque.innerHTML = '';
    return;
  }
  const couleurs = { 'fort-achat': ['#1E8449', '#FFFFFF'], 'achat': ['#7DBB92', '#0F2B18'], 'attendre': ['#B5BCC3', '#2B3338'], 'vente': ['#E8A29A', '#4A0E0A'], 'fort-vente': ['#C0392B', '#FFFFFF'] };
  const pair = couleurs[s.couleur] || couleurs['attendre'];
  badge.textContent = s.signal;
  badge.style.background = pair[0]; badge.style.color = pair[1];
  expl.textContent = s.explication + ' Score : ' + (s.score > 0 ? '+' : '') + s.score + '.';
  conf.textContent = 'Confiance : ' + s.confiance;
  
  if (s.stopLoss && s.takeProfit) {
    risque.innerHTML = '<b>Gestion du Risque (Ratio ' + s.ratioRR + ')</b>'
      + '🛑 <b>Stop-Loss : ' + formaterNombre(s.stopLoss) + ' $</b><br>'
      + '🎯 <b>Take-Profit : ' + formaterNombre(s.takeProfit) + ' $</b>';
    risque.style.display = 'block';
  } else { risque.style.display = 'none'; }

  detail.innerHTML = s.details.map((d) => {
    const signe = d.pts > 0 ? '+' : '';
    const coul = d.pts > 0 ? 'var(--vert)' : (d.pts < 0 ? 'var(--rouge)' : '#6B7785');
    return '<div><span>' + d.nom + '</span><span style="color:#6B7785;font-size:.8rem;flex:1;text-align:right">' + d.valeur + '</span><span style="color:' + coul + ';font-weight:700;min-width:40px;text-align:right">' + signe + d.pts + '</span></div>';
  }).join('');
}

function mettreAJourVL(jeuJournalier) {
  const vlRefInput = document.getElementById('vl_ref');
  const vlDateInput = document.getElementById('vl_date');

  let vlRef = parseFloat(localStorage.getItem('novartis.vlRef')) || 109.657;
  let vlDate = localStorage.getItem('novartis.vlDate');
  if (!vlDate) {
    vlDate = new Date().toISOString().split('T')[0];
    localStorage.setItem('novartis.vlDate', vlDate);
  }
  
  vlRefInput.value = vlRef;
  vlDateInput.value = vlDate;

  document.getElementById('sauver_vl').onclick = () => {
    const v = parseFloat(vlRefInput.value);
    const d = vlDateInput.value;
    if (v > 0 && d) {
      localStorage.setItem('novartis.vlRef', v);
      localStorage.setItem('novartis.vlDate', d);
      afficher();
    }
  };

  if (!jeuJournalier || !jeuJournalier.points || !jeuJournalier.points.length) return;
  
  const points = jeuJournalier.points;
  const dernierPoint = points[points.length - 1];
  const coursActuel = dernierPoint.adjclose || dernierPoint.close;

  const targetTs = new Date(vlDate + 'T12:00:00Z').getTime() / 1000;
  let pointRef = points[0];
  let minDiff = Math.abs(points[0].timestamp - targetTs);
  
  for (let i = 1; i < points.length; i++) {
    const diff = Math.abs(points[i].timestamp - targetTs);
    if (diff < minDiff) {
      minDiff = diff;
      pointRef = points[i];
    }
  }

  const coursRef = pointRef.adjclose || pointRef.close;
  const variation = (coursActuel - coursRef) / coursRef;
  const vlActuelle = vlRef * (1 + variation);
  
  const estVert = vlActuelle >= vlRef;
  const pourcentage = (variation * 100).toFixed(2);
  
  document.getElementById('resultat_vl').innerHTML = 'Valeur actuelle estimée : <br>'
    + '<b style="font-size:1.4rem;color:' + (estVert ? 'var(--vert)' : 'var(--rouge)') + '">' + formaterNombre(vlActuelle) + ' €</b>'
    + '<br><span style="font-size:0.9rem;color:' + (estVert ? 'var(--vert)' : 'var(--rouge)') + '">'
    + (estVert ? '▲ +' : '▼ ') + pourcentage + '% par rapport au ' + new Date(vlDate).toLocaleDateString('fr-FR') + '</span>';
}

function parserRSS(xml) {
  try {
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    return [...doc.querySelectorAll('item')].slice(0, 10).map((i) => ({
      titre: (i.querySelector('title')?.textContent || '').trim(),
      lien: (i.querySelector('link')?.textContent || '').trim(),
      date: (i.querySelector('pubDate')?.textContent || '').trim()
    })).filter((a) => a.titre);
  } catch (e) { return []; }
}
async function chargerActus() {
  const textes = await Promise.all([
    lire(URL_NEWS_FR).catch(() => ''),
    lire(URL_NEWS_EN).catch(() => '')
  ]);
  return [...parserRSS(textes[0]), ...parserRSS(textes[1])]
    .filter((a, i, arr) => arr.findIndex((x) => x.titre === a.titre) === i)
    .sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0))
    .slice(0, 15);
}
function afficherActus(actus) {
  const el = document.getElementById('actus');
  if (!actus.length) { el.innerHTML = '<div style="color:#6B7785">Aucune actu.</div>'; return; }
  el.innerHTML = actus.map((a) => {
    const score = analyserTitre(a.titre);
    const cls = score > 0 ? 'actu-pos' : (score < 0 ? 'actu-neg' : '');

    return '<div data-lien="' + (a.lien || '') + '"><div class="actu-titre">' + a.titre + '</div><div class="actu-meta">' + (a.date ? new Date(a.date).toLocaleDateString('fr-FR') : '') + ' <span class="' + cls + '">' + signe + '</span></div></div>';
  }).join('');
}
document.getElementById('actus').addEventListener('click', (e) => {

  else window.open(d.dataset.lien, '_blank');
});

function dessinerGraphique(points) {
  const canvas = document.getElementById('graphique');
  const ctx = canvas.getContext('2d');
  const largeur = canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1);
  const hauteur = canvas.height = canvas.clientHeight * (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, largeur, hauteur);
  if (!points.length) return;
  const clotures = points.map((p) => valeurPoint(p)).filter((v) => v != null);
  const min = Math.min(...clotures), max = Math.max(...clotures);
  const marge = (max - min) * 0.1 || 1;
  const x = (i) => (i / (points.length - 1 || 1)) * (largeur - 40) + 20;
  const y = (v) => hauteur - 20 - ((v - (min - marge)) / ((max + marge) - (min - marge))) * (hauteur - 40);
  ctx.strokeStyle = '#0B5FA5'; ctx.lineWidth = 2 * (window.devicePixelRatio || 1);
  ctx.beginPath();
  points.forEach((p, i) => {
    const v = valeurPoint(p); if (v == null) return;
    if (i === 0) ctx.moveTo(x(i), y(v)); else ctx.lineTo(x(i), y(v));
  });
  ctx.stroke();
}
function afficherTableau(points, intervalle) {
  document.getElementById('tableau').innerHTML = points.map((p) => `<tr><td>${formaterDate(p.timestamp, intervalle)}</td><td>${formaterNombre(p.open)}</td><td>${formaterNombre(p.high)}</td><td>${formaterNombre(p.low)}</td><td>${formaterNombre(p.close)}</td><td>${formaterNombre(p.adjclose)}</td><td>${formaterNombre(p.volume)}</td></tr>`).join('');
}

function afficher(erreurMsg) {
  const intervalle = document.getElementById('intervalle').value;
  const periode = document.getElementById('periode').value;

  const j2 = etat.jeux['1h'];

  mettreAJourVL(j1);

  if (!j1 || !j1.points || !j1.points.length) {
    document.getElementById('message').textContent = erreurMsg || 'Aucune donnée. Actualise.';
    afficherSignal(null); afficherActus([]);
    document.getElementById('backtest').textContent = '—';
    return;
  }
  const jeu = intervalle === '1h' && j2 ? j2 : j1;
  const points = filtrerPoints(jeu.points, periode, Date.now());
  document.getElementById('message').textContent = points.length + ' points affichés / ' + jeu.points.length + ' enregistrés.';
  
  dessinerGraphique(points);
  afficherTableau(points, intervalle);
  afficherActus(etat.actus);
  
  mettreAJourVL(j1);
  const s = calculerSignal(j1.points, j2 ? j2.points : j1.points, etat.actus);
  afficherSignal(s);
  
  const bt = lancerBacktest(j1.points, j1.points);
  if (bt && bt.trades > 0) {
    document.getElementById('backtest').innerHTML = 'Sur les 5 dernières années, ce signal a généré <b>' + bt.trades + ' achats</b>.<br>'
      + '✅ Taux de réussite : <b>' + bt.winRate + '%</b><br>'
      + '📈 Gain moyen : +' + bt.gainMoyen + '%';
  } else {
    document.getElementById('backtest').textContent = 'Pas assez de données.';
  }

  const ancienSignal = localStorage.getItem('novartis.dernierSignal');
  if (ancienSignal !== s.signal && s.confiance === 'Haute') {
    if (window.Android && Android.notifier) Android.notifier('Novartis : ' + s.signal, s.explication);
    localStorage.setItem('novartis.dernierSignal', s.signal);
  }
}

async function telechargerJeu(jeu) {
  // Si c'est le journalier, on utilise Stooq (très stable, pas de blocage)
  if (jeu.cle === '1d') {
    const texte = await lire('https://stooq.com/q/d/l/?s=nvs.us&i=d');
    if (!texte || texte.includes('<html')) throw new Error('Stooq a renvoyé une page web au lieu des données.');
    
    const lignes = texte.trim().split('\n');
    const points = [];
    
    // On ignore la première ligne (Date,Open,High,Low,Close,Volume)
    for (let i = 1; i < lignes.length; i++) {
      const cols = lignes[i].split(',');
      if (cols.length >= 6 && cols[4] !== '') {
        const ts = Math.floor(new Date(cols[0] + 'T14:30:00Z').getTime() / 1000);
        points.push({
          timestamp: ts,
          open: parseFloat(cols[1]),
          high: parseFloat(cols[2]),
          low: parseFloat(cols[3]),
          close: parseFloat(cols[4]),
          adjclose: parseFloat(cols[4]), // Stooq ne fournit pas l'ajusté, on utilise le close
          volume: parseInt(cols[5], 10)
        });
      }
    }
    if (!points.length) throw new Error('Aucun point extrait des données Stooq.');
    return { points, devise: 'USD' };
  }

  // Pour l'horaire, on tente encore Yahoo (ou on renvoie une erreur si bloqué)
  const texte = await lire(urlCours(jeu));
  if (!texte || texte.trim() === '') throw new Error('Réponse vide.');
  if (texte.includes("Too Many Requests") || texte.includes("429")) throw new Error('Limite Yahoo atteinte (429).');
  let data;
  try { data = JSON.parse(texte); } catch (e) { throw new Error('JSON invalide.'); }
  if (!data.chart || !data.chart.result || !data.chart.result[0]) throw new Error('Données introuvables.');
  const r = data.chart.result[0];
  const timestamps = r.timestamp || [];
  const q = r.indicators.quote[0] || {};
  const points = [];
  for (let i = 0; i < timestamps.length; i++) {
    if (q.close[i] == null) continue;
    points.push({ timestamp: timestamps[i], open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i], volume: q.volume[i] });
  }
  return { points, devise: 'USD' };
}

async function toutActualiser() {
  const bouton = document.getElementById('charger');
  bouton.disabled = true;
  document.getElementById('message').textContent = '';
  let faits = 0;
  const erreurs = [];

  // 1. Téléchargement des cours (on garde le cache actuel en cas d'échec)
  for (const jeu of JEUX) {
    document.getElementById('progression').textContent = 'Téléchargement ' + jeu.libelle + ' (' + jeu.range + ')…';
    try {
      const data = await telechargerJeu(jeu);
      etat.jeux[jeu.cle] = { points: data.points, devise: data.devise, dateMax: Date.now() };
      ecrireCache(jeu.cle, data);
      faits++;
    } catch (e) {
      erreurs.push(jeu.libelle + ' : ' + e.message);
    }
  }

  // 3. Téléchargement des actualités
  document.getElementById('progression').textContent = 'Actualités…';
  try {
    etat.actus = await chargerActus();
    localStorage.setItem(CLE_ACTUS, JSON.stringify({ dateMax: Date.now(), actus: etat.actus }));
  } catch (e) {
    erreurs.push('Actualités : ' + e.message);
  }

  bouton.disabled = false;
  document.getElementById('progression').textContent = '';
  
  // 4. Affichage du résultat
  if (erreurs.length > 0) {
    afficher('❌ Erreur(s) : ' + erreurs.join(' | '));
  } else {
    afficher();
  }
}

document.getElementById('vider').onclick = () => {

    document.getElementById('progression').textContent = '';

// ===== CONTRÔLE QUALITÉ =====
const normaliserEspaces = (s) => String(s).replace(/[\u202f\u00a0\u2009]/g, ' ');
function controleQualite() {
  const cas = [
    ['Formatage 2.5 → 2,50', () => normaliserEspaces(formaterNombre(2.5)), '2,50'],
    ['RSI croissant = 100', () => rsi(Array.from({ length: 20 }, (_, i) => ({ close: 100 + i })), 14), 100],
    ['RSI décroissant = 0', () => rsi(Array.from({ length: 20 }, (_, i) => ({ close: 200 - i })), 14), 0],
    ['Analyse « approval » → +1', () => analyserTitre('approval'), 1],
    ['Analyse « lawsuit » → -1', () => analyserTitre('lawsuit'), -1],
  ];
  const ko = [];
  for (const [nom, f, attendu] of cas) {
    let obtenu; try { obtenu = f(); } catch (e) { obtenu = 'plantage'; }
    const ok = typeof attendu === 'number' ? (typeof obtenu === 'number' && Math.abs(obtenu - attendu) < 0.01) : String(obtenu) === String(attendu);
    if (!ok) ko.push(nom + ' : attendu ' + JSON.stringify(attendu) + ', obtenu ' + JSON.stringify(obtenu));
  }
  const el = document.getElementById('controle');
  if (el) el.textContent = ko.length ? '❌ ' + ko.length + ' contrôle(s) en échec : ' + ko.join(' ; ') : '✅ Tout est conforme';
  for (const k of ko) console.error('Contrôle qualité — ' + k);
}
controleQualite();
